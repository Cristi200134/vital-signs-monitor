<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<title>VitalMonitor — Istoric Pacienti</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html,body{height:100vh;overflow:hidden;background:#000;color:#fff;
  font-family:'Segoe UI',Arial,sans-serif}

/*header 52px*/
.hdr{height:52px;display:flex;align-items:center;justify-content:space-between;
  padding:0 16px;background:#080808;border-bottom:2px solid #1a1a1a}
.hdr-logo{display:flex;align-items:center;gap:10px}
.hdr-logo svg{width:22px;height:22px}
.hdr-title{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:2px;color:#fff}
.hdr-sub{font-size:9px;color:#444;margin-top:1px;letter-spacing:1px;text-transform:uppercase}
.hdr-nav{display:flex;gap:6px;align-items:center}
.btn{padding:4px 12px;border:1px solid #2a2a2a;font-size:10px;font-weight:700;
  cursor:pointer;background:#000;color:#666;font-family:inherit;
  letter-spacing:1px;text-transform:uppercase}
.btn:hover{border-color:#555;color:#ccc}
.btn-pri{background:#00aa00;border-color:#00aa00;color:#000}
.btn-pri:hover{background:#00cc00;border-color:#00cc00}
.btn-sec{background:#0a0a0a;color:#888}
.btn-red{border-color:#ff2020;color:#ff2020;background:#000}
.btn-red:hover{background:#1a0000}

/*layout principal*/
.main{display:grid;grid-template-columns:220px 1fr;height:calc(100vh - 52px)}

/*sidebar*/
.sidebar{background:#080808;border-right:2px solid #1a1a1a;
  display:flex;flex-direction:column;overflow:hidden;height:100%}
.sidebar-hdr{padding:10px 10px 8px;border-bottom:1px solid #1a1a1a;flex-shrink:0}
.sidebar-hdr h3{font-size:8px;color:#444;text-transform:uppercase;
  letter-spacing:1.5px;margin-bottom:7px;font-weight:700}
.search{width:100%;padding:5px 9px;background:#000;border:1px solid #2a2a2a;
  color:#fff;font-size:11px;outline:none;font-family:inherit}
.search:focus{border-color:#00ff00}
.pacient-list{flex:1;overflow-y:auto;padding:4px}
.pacient-item{padding:6px 9px;cursor:pointer;border:1px solid transparent;margin-bottom:2px}
.pacient-item:hover{background:#0d0d0d;border-color:#2a2a2a}
.pacient-item.activ{background:#0a0a0a;border-color:#00cc00;border-left:2px solid #00cc00}
.p-nume{font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#fff}
.p-meta{font-size:9px;color:#555;margin-top:2px}
.p-badge{display:inline-block;padding:1px 5px;font-size:8px;font-weight:700;margin-top:3px;
  border:1px solid;letter-spacing:1px;text-transform:uppercase}
.p-badge.ok    {color:#00cc00;border-color:#00cc00}
.p-badge.alerta{color:#ffcc00;border-color:#ffcc00}
.empty-msg{text-align:center;color:#333;font-size:10px;padding:28px 12px;line-height:1.9}

/*zona de continut*/
.detalii{overflow-y:auto;padding:14px 16px;height:100%}
.welcome{display:flex;flex-direction:column;align-items:center;
  justify-content:center;height:100%;color:#333;text-align:center;gap:10px}
.welcome svg{opacity:.2}
.welcome p{font-size:12px;line-height:1.7;color:#444}

/*card pacient*/
.card-pac{background:#080808;border:1px solid #1a1a1a;border-left:3px solid #00ff00;
  padding:10px 14px;margin-bottom:10px}
.card-pac-hdr{display:flex;justify-content:space-between;align-items:flex-start}
.pac-name{font-size:16px;font-weight:700;color:#fff;font-family:'Courier New',monospace}
.pac-id{font-size:10px;color:#555;margin-top:2px}
.pac-diag{margin-top:7px;padding:6px 10px;background:#0d0d0d;
  border-left:2px solid #333;font-size:11px;color:#666;line-height:1.5}
.pac-actions{display:flex;gap:5px;flex-shrink:0;margin-left:12px}

/*statistici*/
.stat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.stat-box{background:#080808;border:1px solid #1a1a1a;padding:8px 10px}
.stat-label{font-size:8px;color:#444;text-transform:uppercase;letter-spacing:1px;margin-bottom:3px}
.stat-val{font-size:22px;font-weight:700;font-family:'Courier New',monospace}
.stat-val.grn{color:#00ff00}.stat-val.yel{color:#ffcc00}.stat-val.red{color:#ff2020}

/*tabel sesiuni*/
.sectiune-titlu{font-size:10px;font-weight:700;margin-bottom:7px;text-transform:uppercase;
  letter-spacing:1.5px;display:flex;align-items:center;justify-content:space-between;color:#666}
.tabel-wrap{background:#080808;border:1px solid #1a1a1a;overflow:hidden;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:11px}
thead th{background:#0d0d0d;padding:6px 10px;text-align:left;
  font-size:8px;font-weight:700;text-transform:uppercase;letter-spacing:1px;
  color:#444;border-bottom:1px solid #1a1a1a}
tbody tr{border-bottom:1px solid #111;cursor:pointer}
tbody tr:last-child{border-bottom:none}
tbody tr:hover{background:#0d0d0d}
tbody td{padding:6px 10px}
.td-data{color:#444;font-size:10px;font-family:'Courier New',monospace}
.val-ok  {color:#00ff00;font-weight:700}
.val-warn{color:#ffcc00;font-weight:700}
.val-crit{color:#ff2020;font-weight:700}
.val-none{color:#333}

/*modal*/
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.92);
  display:none;align-items:center;justify-content:center;z-index:100}
.modal-overlay.vis{display:flex}
.modal{background:#080808;border:1px solid #2a2a2a;
  width:min(720px,95vw);max-height:86vh;overflow-y:auto;padding:18px}
.modal-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;
  border-bottom:1px solid #1a1a1a;padding-bottom:10px}
.modal-titlu{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px;color:#fff}
.modal-close{background:none;border:1px solid #2a2a2a;color:#666;font-size:14px;
  cursor:pointer;padding:2px 8px;font-family:inherit}
.modal-close:hover{border-color:#555;color:#fff}

/*sparkline*/
.spark-wrap{background:#000;border:1px solid #1a1a1a;padding:10px;margin-bottom:12px}
.spark-titlu{font-size:9px;color:#444;margin-bottom:5px;font-weight:700;
  text-transform:uppercase;letter-spacing:1.5px}
canvas.spark{width:100%;height:56px;display:block;background:#000}

/*zona de import*/
.import-zona{border:2px dashed #1a1a1a;padding:18px;
  text-align:center;margin-bottom:10px}
.import-zona:hover,.import-zona.drag{border-color:#00ff00}
.import-zona p{font-size:12px;color:#444;margin-bottom:7px}

::-webkit-scrollbar{width:4px;height:4px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:#2a2a2a}
</style>
</head>
<body>

<!--header-->
<header class="hdr">
  <div class="hdr-logo">
    <svg viewBox="0 0 24 24" fill="none">
      <rect width="24" height="24" fill="#0a0a0a" stroke="#00cc00" stroke-width="1"/>
      <polyline points="2,12 5,12 7,6 9,18 11,9 13,15 15,12 22,12"
        stroke="white" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </svg>
    <div>
      <div class="hdr-title">VitalMonitor</div>
      <div class="hdr-sub">Istoric Pacienti</div>
    </div>
  </div>
  <div class="hdr-nav">
    <button class="btn btn-sec" onclick="window.location='/'">&#8592; Monitor Live</button>
    <button class="btn btn-sec" onclick="document.getElementById('csvInput').click()">Import CSV</button>
    <button class="btn btn-pri" onclick="exportToateSesiunile()">Export Toate</button>
    <input type="file" id="csvInput" accept=".csv" style="display:none" multiple onchange="importCsv(this.files)">
  </div>
</header>

<!--main-->
<div class="main">

  <aside class="sidebar">
    <div class="sidebar-hdr">
      <h3>Pacienti (<span id="nrPacienti">0</span>)</h3>
      <input class="search" type="text" placeholder="Cauta pacient..."
             oninput="filtreazaPacienti(this.value)">
    </div>
    <div class="pacient-list" id="listaPacienti">
      <div class="empty-msg">
        Nicio sesiune salvata inca.<br><br>
        Datele sunt stocate local in browser.<br><br>
        Importa un CSV de pe cardul SD sau conecteaza-te la monitorul live.
      </div>
    </div>
  </aside>

  <main class="detalii" id="zDetalii">
    <div class="welcome" id="welcome">
      <svg width="56" height="56" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="29" stroke="var(--t2)" stroke-width="2"/>
        <polyline points="12,32 20,32 24,20 28,44 32,26 36,38 40,32 52,32"
          stroke="var(--t2)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      </svg>
      <p>Selecteaza un pacient din lista<br>pentru a vedea istoricul sesiunilor</p>
    </div>
    <div id="continutDetalii" style="display:none"></div>
  </main>
</div>

<!--modal sesiune-->
<div class="modal-overlay" id="modalSesiune">
  <div class="modal">
    <div class="modal-hdr">
      <div class="modal-titlu" id="modalTitlu">Detalii sesiune</div>
      <button class="modal-close" onclick="inchideModal()">&#x2715;</button>
    </div>
    <div id="modalContinut"></div>
  </div>
</div>

<script>
//indexeddb
let db = null;

function deschideDB() {
  return new Promise((res, rej) => {
    const req = indexedDB.open('VitalMonitorDB', 2);
    req.onupgradeneeded = e => {
      const d = e.target.result;
      if (!d.objectStoreNames.contains('pacienti')) {
        const sp = d.createObjectStore('pacienti', { keyPath:'id', autoIncrement:true });
        sp.createIndex('idx_id_extern', 'id_extern', { unique:false });
      }
      if (!d.objectStoreNames.contains('sesiuni')) {
        const ss = d.createObjectStore('sesiuni', { keyPath:'id', autoIncrement:true });
        ss.createIndex('idx_pacient', 'idPacient', { unique:false });
        ss.createIndex('idx_data',    'dataStart',  { unique:false });
      }
    };
    req.onsuccess = e => { db = e.target.result; res(db); };
    req.onerror   = e => rej(e.target.error);
  });
}

function txAdd(storeName, obj) {
  return new Promise((res, rej) => {
    const tx  = db.transaction(storeName, 'readwrite');
    const req = tx.objectStore(storeName).add(obj);
    req.onsuccess = () => res(req.result);
    req.onerror   = e => rej(e.target.error);
  });
}

function txGetAll(storeName) {
  return new Promise((res, rej) => {
    const tx  = db.transaction(storeName, 'readonly');
    const req = tx.objectStore(storeName).getAll();
    req.onsuccess = () => res(req.result);
    req.onerror   = e => rej(e.target.error);
  });
}

function txGetByIndex(storeName, indexName, val) {
  return new Promise((res, rej) => {
    const tx  = db.transaction(storeName, 'readonly');
    const idx = tx.objectStore(storeName).index(indexName);
    const req = idx.getAll(val);
    req.onsuccess = () => res(req.result);
    req.onerror   = e => rej(e.target.error);
  });
}

function txDel(storeName, id) {
  return new Promise((res, rej) => {
    const tx  = db.transaction(storeName, 'readwrite');
    const req = tx.objectStore(storeName).delete(id);
    req.onsuccess = () => res();
    req.onerror   = e => rej(e.target.error);
  });
}

//import csv
async function importCsv(files) {
  for (const file of files) {
    const text = await file.text();
    const linii = text.trim().split('\n');
    if (linii.length < 2) continue;
    const header = linii[0].split(',').map(h => h.trim().toLowerCase());
    const rows = [];
    for (let i = 1; i < linii.length; i++) {
      const cols = linii[i].split(',');
      if (cols.length < 4) continue;
      const r = {};
      header.forEach((h, j) => r[h] = cols[j] ? cols[j].trim() : '');
      rows.push(r);
    }
    if (rows.length === 0) continue;

    let numePacient = file.name
      .replace(/\.csv$/i, '')
      .replace(/^\d{4}-\d{2}-\d{2}_\d{2}-\d{2}-\d{2}_?/, '')
      .replace(/_/g, ' ').trim() || 'Necunoscut';

    const bpmVals  = rows.map(r => parseFloat(r['bpm']  || 0)).filter(v => v > 0 && v < 300);
    const spo2Vals = rows.map(r => parseFloat(r['spo2%'] || r['spo2'] || 0)).filter(v => v > 0 && v <= 100);
    const tempVals = rows.map(r => parseFloat(r['temp.c'] || r['temp_c'] || 0)).filter(v => v > 0 && v < 45);
    const avg = arr => arr.length ? arr.reduce((a,b) => a+b, 0) / arr.length : null;

    const totiPacienti = await txGetAll('pacienti');
    let pac = totiPacienti.find(p => p.nume === numePacient);
    if (!pac) {
      const nId = await txAdd('pacienti', {
        nume: numePacient, id_extern: '', diag: '',
        prima_sesiune: rows[0] ? (rows[0]['data'] || '') : '',
      });
      pac = { id: nId, nume: numePacient };
    }
    await txAdd('sesiuni', {
      idPacient: pac.id, numeFisier: file.name,
      dataStart: rows[0] ? (rows[0]['data'] + ' ' + (rows[0]['ora'] || '')) : '',
      dataEnd:   rows[rows.length-1] ? (rows[rows.length-1]['data'] || '') : '',
      nrRanduri: rows.length,
      bpmMed:  avg(bpmVals)  ? +avg(bpmVals).toFixed(1)  : null,
      spo2Med: avg(spo2Vals) ? +avg(spo2Vals).toFixed(1) : null,
      tempMed: avg(tempVals) ? +avg(tempVals).toFixed(1) : null,
      rawRows: rows.slice(0, 3600),
    });
  }
  await redareaza();
  alert('Import finalizat!');
}

//randare lista pacienti
let totiPacientiCache = [];
let toateSesiunileCache = [];
let pacientActiv = null;

async function redareaza() {
  totiPacientiCache   = await txGetAll('pacienti');
  toateSesiunileCache = await txGetAll('sesiuni');
  document.getElementById('nrPacienti').textContent = totiPacientiCache.length;
  filtreazaPacienti(document.querySelector('.search').value);
}

function filtreazaPacienti(query) {
  const q = query.toLowerCase();
  const filtrat = totiPacientiCache.filter(p =>
    p.nume.toLowerCase().includes(q) || (p.id_extern || '').toLowerCase().includes(q)
  );
  randeazaListaPacienti(filtrat);
}

function randeazaListaPacienti(lista) {
  const el = document.getElementById('listaPacienti');
  if (lista.length === 0) {
    el.innerHTML = `<div class="empty-msg">Niciun pacient gasit.</div>`;
    return;
  }
  el.innerHTML = lista.map(p => {
    const sesiuniP = toateSesiunileCache.filter(s => s.idPacient === p.id);
    const ultimaS  = sesiuniP[sesiuniP.length - 1];
    const activ    = pacientActiv && pacientActiv.id === p.id ? 'activ' : '';
    const badgeAlerta = sesiuniP.some(s => s.spo2Med && s.spo2Med < 94);
    return `<div class="pacient-item ${activ}" onclick="selecteazaPacient(${p.id})">
      <div class="p-nume">${escHtml(p.nume)}</div>
      <div class="p-meta">${sesiuniP.length} sesiuni${ultimaS ? ' · ' + escHtml(ultimaS.dataStart.slice(0,10)) : ''}</div>
      <span class="p-badge ${badgeAlerta ? 'alerta' : 'ok'}">${badgeAlerta ? 'Atentie SpO2' : 'Normal'}</span>
    </div>`;
  }).join('');
}

//detalii pacient
async function selecteazaPacient(idPac) {
  pacientActiv = totiPacientiCache.find(p => p.id === idPac);
  if (!pacientActiv) return;
  randeazaListaPacienti(totiPacientiCache);

  const sesiuni = toateSesiunileCache.filter(s => s.idPacient === idPac)
    .sort((a,b) => (a.dataStart > b.dataStart ? -1 : 1));

  const bpmVals  = sesiuni.filter(s => s.bpmMed).map(s => s.bpmMed);
  const spo2Vals = sesiuni.filter(s => s.spo2Med).map(s => s.spo2Med);
  const avg = arr => arr.length ? (arr.reduce((a,b)=>a+b,0)/arr.length).toFixed(1) : '—';

  const clasaBpm  = s => s.bpmMed > 100 ? 'val-warn' : s.bpmMed < 55 ? 'val-warn' : 'val-ok';
  const clasaSpo2 = s => s.spo2Med < 90 ? 'val-crit' : s.spo2Med < 94 ? 'val-warn' : 'val-ok';

  document.getElementById('welcome').style.display = 'none';
  const cont = document.getElementById('continutDetalii');
  cont.style.display = 'block';

  cont.innerHTML = `
    <div class="card-pac">
      <div class="card-pac-hdr">
        <div>
          <div class="pac-name">${escHtml(pacientActiv.nume)}</div>
          <div class="pac-id">${pacientActiv.id_extern ? 'ID: ' + escHtml(pacientActiv.id_extern) : 'ID neinregistrat'} &bull; Prima sesiune: ${escHtml(pacientActiv.prima_sesiune || '—')}</div>
        </div>
        <div class="pac-actions">
          <button class="btn btn-sec" onclick="exportPacient(${idPac})">Export CSV</button>
          <button class="btn btn-red" onclick="stergePacient(${idPac})">Sterge</button>
        </div>
      </div>
      ${pacientActiv.diag ? `<div class="pac-diag"><b>Diagnostic:</b> ${escHtml(pacientActiv.diag)}</div>` : ''}
    </div>

    <div class="stat-grid">
      <div class="stat-box">
        <div class="stat-label">Sesiuni totale</div>
        <div class="stat-val">${sesiuni.length}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">BPM mediu global</div>
        <div class="stat-val ${bpmVals.length && parseFloat(avg(bpmVals))>100?'yel':bpmVals.length&&parseFloat(avg(bpmVals))<55?'yel':'grn'}">${avg(bpmVals)}</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">SpO2 mediu global</div>
        <div class="stat-val ${spo2Vals.length && parseFloat(avg(spo2Vals))<90?'red':spo2Vals.length&&parseFloat(avg(spo2Vals))<94?'yel':'grn'}">${avg(spo2Vals)}%</div>
      </div>
      <div class="stat-box">
        <div class="stat-label">Inregistrari totale</div>
        <div class="stat-val">${sesiuni.reduce((a,s)=>a+s.nrRanduri,0).toLocaleString()}</div>
      </div>
    </div>

    <div class="sectiune-titlu"><span>Sesiuni inregistrate</span></div>
    <div class="tabel-wrap">
      <table>
        <thead>
          <tr>
            <th>Data / Ora start</th><th>Durata</th>
            <th>BPM med.</th><th>SpO2 med.</th><th>Temp med.</th>
            <th>Fisier</th><th></th>
          </tr>
        </thead>
        <tbody>
          ${sesiuni.map(s => `
            <tr onclick="deschideModalSesiune(${s.id})">
              <td class="td-data">${escHtml(s.dataStart)}</td>
              <td class="td-data">${calcDurata(s.nrRanduri)}</td>
              <td class="${clasaBpm(s)}">${s.bpmMed ?? '<span class="val-none">—</span>'}</td>
              <td class="${clasaSpo2(s)}">${s.spo2Med != null ? s.spo2Med + '%' : '<span class="val-none">—</span>'}</td>
              <td>${s.tempMed != null ? s.tempMed + ' °C' : '<span class="val-none">—</span>'}</td>
              <td class="td-data" style="font-size:10px;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(s.numeFisier)}</td>
              <td><button class="btn" style="padding:3px 8px;font-size:10px"
                  onclick="event.stopPropagation();exportSesiune(${s.id})">CSV</button></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>`;
}

//modal detalii sesiune
async function deschideModalSesiune(idSes) {
  const ses = toateSesiunileCache.find(s => s.id === idSes);
  if (!ses || !ses.rawRows) return;
  document.getElementById('modalTitlu').textContent = 'Sesiune ' + (ses.dataStart || '');
  const rows = ses.rawRows;
  const canvasId = 'spark-' + idSes;

  document.getElementById('modalContinut').innerHTML = `
    <div class="spark-wrap">
      <div class="spark-titlu">Trend BPM — sesiune</div>
      <canvas class="spark" id="${canvasId}" width="640" height="56"></canvas>
    </div>
    <div class="tabel-wrap" style="max-height:340px;overflow-y:auto">
      <table>
        <thead>
          <tr><th>Data</th><th>Ora</th><th>BPM</th><th>SpO2%</th><th>Temp.C</th><th>Resp.rpm</th><th>Alarma</th></tr>
        </thead>
        <tbody>
          ${rows.slice(0, 500).map(r => {
            const bpm  = parseFloat(r['bpm']  || 0);
            const spo2 = parseFloat(r['spo2%'] || r['spo2'] || 0);
            return `<tr>
              <td class="td-data">${escHtml(r['data']||'')}</td>
              <td class="td-data">${escHtml(r['ora']||'')}</td>
              <td class="${bpm>110||bpm<45?'val-crit':bpm>100||bpm<55?'val-warn':'val-ok'}">${bpm||'—'}</td>
              <td class="${spo2<90?'val-crit':spo2<94?'val-warn':'val-ok'}">${spo2||'—'}</td>
              <td>${escHtml(r['temp.c']||r['temp_c']||'—')}</td>
              <td>${escHtml(r['resp.rpm']||r['resp_rpm']||'—')}</td>
              <td style="font-size:10px;color:#ffcc00">${escHtml(r['alarma']||r['alarm_msg']||'')}</td>
            </tr>`;
          }).join('')}
          ${rows.length > 500 ? `<tr><td colspan="7" style="text-align:center;color:var(--t2);padding:10px">
            ... si inca ${rows.length - 500} randuri. Exporta CSV pentru date complete.</td></tr>` : ''}
        </tbody>
      </table>
    </div>`;

  document.getElementById('modalSesiune').classList.add('vis');

  requestAnimationFrame(() => {
    const cv = document.getElementById(canvasId);
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.offsetWidth || 640; const H = 56;
    cv.width = W; cv.height = H;
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,W,H);
    const bpmVals = rows.map(r => parseFloat(r['bpm']||0)).filter(v=>v>0);
    if (bpmVals.length < 2) return;
    const mn = Math.min(...bpmVals) - 5;
    const mx = Math.max(...bpmVals) + 5;
    const toX = i => i / (bpmVals.length-1) * W;
    const toY = v => H - (v-mn)/(mx-mn) * H;
    ctx.strokeStyle = '#00ff00'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    bpmVals.forEach((v,i) => i===0 ? ctx.moveTo(toX(i),toY(v)) : ctx.lineTo(toX(i),toY(v)));
    ctx.stroke();
    ctx.strokeStyle = '#003300'; ctx.lineWidth = 1; ctx.setLineDash([4,4]);
    const y60 = toY(60);
    ctx.beginPath(); ctx.moveTo(0,y60); ctx.lineTo(W,y60); ctx.stroke();
    ctx.setLineDash([]);
  });
}

//export csv
async function exportSesiune(idSes) {
  const ses = toateSesiunileCache.find(s => s.id === idSes);
  if (!ses || !ses.rawRows) return;
  const header = 'Data,Ora,BPM,SpO2%,Temp.C,Resp.rpm,Alarma,Electrozi,Ev';
  const linii = ses.rawRows.map(r =>
    [r['data']||'',r['ora']||'',r['bpm']||'',r['spo2%']||r['spo2']||'',
     r['temp.c']||r['temp_c']||'',r['resp.rpm']||r['resp_rpm']||'',
     r['alarma']||r['alarm_msg']||'',
     r['electrozi']||r['lead_off']||'',r['ev']||r['eveniment']||''].join(',')
  );
  descarcaText([header,...linii].join('\n'), ses.numeFisier || 'sesiune.csv');
}

async function exportPacient(idPac) {
  const sesiuni = toateSesiunileCache.filter(s => s.idPacient === idPac);
  const pac = totiPacientiCache.find(p => p.id === idPac);
  const header = 'Data,Ora,BPM,SpO2%,Temp.C,Resp.rpm,Fisier';
  const linii = [];
  sesiuni.forEach(ses => {
    (ses.rawRows || []).forEach(r => {
      linii.push([r['data']||'',r['ora']||'',r['bpm']||'',
        r['spo2%']||r['spo2']||'',r['temp.c']||r['temp_c']||'',
        r['resp.rpm']||r['resp_rpm']||'',ses.numeFisier||''].join(','));
    });
  });
  const numeFisier = (pac?.nume || 'pacient').replace(/\s+/g,'_') + '_complet.csv';
  descarcaText([header,...linii].join('\n'), numeFisier);
}

async function exportToateSesiunile() {
  const header = 'Pacient,Data,Ora,BPM,SpO2%,Temp.C';
  const linii  = [];
  for (const pac of totiPacientiCache) {
    const sesiuni = toateSesiunileCache.filter(s => s.idPacient === pac.id);
    sesiuni.forEach(ses => {
      (ses.rawRows || []).forEach(r => {
        linii.push([escCsv(pac.nume),r['data']||'',r['ora']||'',
          r['bpm']||'',r['spo2%']||r['spo2']||'',
          r['temp.c']||r['temp_c']||''].join(','));
      });
    });
  }
  descarcaText([header,...linii].join('\n'), 'VitalMonitor_export_complet.csv');
}

//stergere pacient
async function stergePacient(idPac) {
  if (!confirm('Stergi pacientul si toate sesiunile lui? Actiunea nu poate fi anulata.')) return;
  const sesiuni = toateSesiunileCache.filter(s => s.idPacient === idPac);
  for (const s of sesiuni) await txDel('sesiuni', s.id);
  await txDel('pacienti', idPac);
  pacientActiv = null;
  document.getElementById('welcome').style.display = 'flex';
  document.getElementById('continutDetalii').style.display = 'none';
  await redareaza();
}

//drag & drop csv
document.addEventListener('dragover', e => e.preventDefault());
document.addEventListener('drop', e => {
  e.preventDefault();
  const files = [...e.dataTransfer.files].filter(f => f.name.endsWith('.csv'));
  if (files.length) importCsv(files);
});

//utilitare
function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}
function escCsv(s) {
  return String(s).includes(',') ? `"${s}"` : s;
}
function descarcaText(text, numeFisier) {
  const a = document.createElement('a');
  a.href = 'data:text/csv;charset=utf-8,' + encodeURIComponent(text);
  a.download = numeFisier; a.click();
}
function calcDurata(nrRanduri) {
  if (!nrRanduri) return '—';
  const sec = nrRanduri;
  if (sec < 60) return sec + 's';
  if (sec < 3600) return Math.floor(sec/60) + 'min ' + (sec%60) + 's';
  return Math.floor(sec/3600) + 'h ' + Math.floor((sec%3600)/60) + 'min';
}
