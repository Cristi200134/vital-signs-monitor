
;board: esp32 doit devkit v1 (dual-core 240 mhz, 4mb flash)
;flash: 4 mb / partition: min_spiffs (app 1.3mb, littlefs 1.4mb)


[env:esp32doit-devkit-v1]
platform   = espressif32@6.6.0
board      = esp32doit-devkit-v1
framework  = arduino

;serial
monitor_speed  = 115200
upload_speed   = 921600

;port serial (auto-detectat daca e comentat)
;macbook:ruleaza "ls /dev/cu.*" in terminal pt port
;/dev/cu.usbserial-0001 sau /dev/cu.slab_usbtouart


monitor_filters = colorize, time

;filesystem: littlefs (spiffs e deprecated in esp32 core 3.x)
board_build.filesystem = littlefs
board_build.partitions = min_spiffs.csv

;build flags
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -DARDUINO_ESP32_DEV
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0    ;asynctcp pe core 0 (impreuna cu wifi)
    -DCONFIG_ASYNC_TCP_USE_WDT=0
    -std=gnu++17                          ;c++17 pentru constexpr si if constexpr

;biblioteci (cu versiuni fixe)
lib_deps =
    ;display oled ssd1306 i2c (128x64)
    adafruit/Adafruit SSD1306              @ ^2.5.9
    adafruit/Adafruit GFX Library          @ ^1.11.9
    adafruit/Adafruit BusIO                @ ^1.16.1

    ;rtc ds3231 (precizie ±2ppm, tcxo)
    adafruit/RTClib                        @ ^2.1.4

    ;adc ads1115 16-bit i2c (ecg + masurare baterie)
    adafruit/Adafruit ADS1X15              @ ^2.5.0

    ;senzor puls + spo2 max30102
    sparkfun/SparkFun MAX3010x Pulse and Proximity Sensor Library @ ^1.1.2

    ;temperatura ds18b20 (onewire)
    paulstoffregen/OneWire                 @ ^2.3.8
    milesburton/DallasTemperature          @ ^3.11.0

    ;webserver + websocket asincron (fork mathieucarbou)
   
    ;mathieucarbou fork, api identic
    https://github.com/mathieucarbou/ESPAsyncWebServer.git @ ^3.3.23
    https://github.com/mathieucarbou/AsyncTCP.git          @ ^3.3.2

    ;json rapid fara alocare dinamica (jsondocument v7) 
    bblanchon/ArduinoJson                  @ ^7.0.4
